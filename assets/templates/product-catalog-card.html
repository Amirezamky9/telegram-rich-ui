<h3><tg-emoji emoji-id="5983399041197675256">🏪</tg-emoji> {{PRODUCT_NAME}}</h3>
<tg-slideshow>
  <img src="{{IMAGE_1_URL}}"/>
  <img src="{{IMAGE_2_URL}}"/>
  <figcaption>{{CAPTION}}<cite>{{BRAND}}</cite></figcaption>
</tg-slideshow>
<p>{{DESCRIPTION}}</p>
<table bordered striped compact>
  <caption>Specifications</caption>
  <tr><th>Feature</th><th align="right">Value</th></tr>
  <tr><td>SKU</td><td align="right"><code>{{SKU}}</code></td></tr>
  <tr><td>Stock</td><td align="right">{{STOCK}}</td></tr>
  <tr><td><b>Price</b></td><td align="right"><b>{{PRICE}}</b></td></tr>
</table>
<tg-button-row align="center">
  <tg-button type="url" style="success" url="{{CHECKOUT_URL}}"><tg-emoji emoji-id="5927169041595634481">💳</tg-emoji> Buy</tg-button>
  <tg-button type="callback_data" style="primary" data="cart:{{PRODUCT_KEY}}">Add to cart</tg-button>
  <tg-button type="copy_text" text="{{SKU}}"><tg-emoji emoji-id="5877301185639091664">📋</tg-emoji> Copy SKU</tg-button>
</tg-button-row>
