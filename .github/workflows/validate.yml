name: validate

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_skill.py
      - run: python3 scripts/validate_emoji_catalog.py
      - run: python3 scripts/search_emoji.py settings --limit 3
      - run: python3 scripts/search_emoji.py تنظیمات --limit 1 --format html
      - run: python3 scripts/search_emoji.py --curated iran_culture --limit 3
      - run: python3 scripts/search_emoji.py settings --limit 1 --format button-json
      - name: Package skill.zip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path.cwd()
          out=root/"skill.zip"
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if not p.is_file() or ".git" in p.parts or p.name=="skill.zip" or "__pycache__" in p.parts:
                      continue
                  z.write(p, Path("telegram-rich-ui")/p.relative_to(root))
          print(out.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-rich-ui-skill
          path: skill.zip
          if-no-files-found: error

  aiogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r assets/aiogram-starter/requirements.txt
      - run: python3 -m py_compile assets/aiogram-starter/main.py
      - run: python3 -c "import aiogram; from aiogram.types import InputRichMessage; assert InputRichMessage(html='<p>ok</p>')"

  grammy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/grammy-cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/grammy-cloudflare-worker/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
